# =============================================================================
# Wardrowbe Microservices — Docker Compose
# =============================================================================
# Usage: docker compose -f docker-compose.microservices.yml up -d
# =============================================================================

services:
  # ======================== INFRASTRUCTURE ========================

  # PostgreSQL — shared instance, separate databases per service
  postgres:
    image: postgres:15-alpine
    container_name: wardrowbe-ms-db
    environment:
      POSTGRES_USER: wardrobe
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wardrobe}
      POSTGRES_DB: wardrowbe_users
    volumes:
      - ms_postgres_data:/var/lib/postgresql/data
      - ./microservices/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wardrobe"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis — caching and session storage
  redis:
    image: redis:7-alpine
    container_name: wardrowbe-ms-redis
    ports:
      - "6379:6379"
    volumes:
      - ms_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # RabbitMQ — async messaging between services
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: wardrowbe-ms-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI
    volumes:
      - ms_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Keycloak — OAuth2/OIDC authentication
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: wardrowbe-ms-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/wardrowbe_keycloak
      KC_DB_USERNAME: wardrobe
      KC_DB_PASSWORD: ${DB_PASSWORD:-wardrobe}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    command: start-dev
    ports:
      - "8180:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ======================== SPRING CLOUD INFRA ========================

  # Eureka Server — service discovery
  eureka-server:
    build:
      context: ./microservices/eureka-server
      dockerfile: Dockerfile
    container_name: wardrowbe-ms-eureka
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # API Gateway — single entry point
  api-gateway:
    build:
      context: ./microservices/api-gateway
      dockerfile: Dockerfile
    container_name: wardrowbe-ms-gateway
    environment:
      EUREKA_HOST: eureka-server
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/wardrowbe
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: unless-stopped

  # ======================== MICROSERVICES ========================

  # User Service
  user-service:
    build:
      context: ./microservices/user-service
      dockerfile: Dockerfile
    container_name: wardrowbe-ms-user
    environment:
      DB_HOST: postgres
      DB_NAME: wardrowbe_users
      DB_USER: wardrobe
      DB_PASSWORD: ${DB_PASSWORD:-wardrobe}
      EUREKA_HOST: eureka-server
      RABBITMQ_HOST: rabbitmq
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/wardrowbe
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Wardrobe Service
  wardrobe-service:
    build:
      context: ./microservices/wardrobe-service
      dockerfile: Dockerfile
    container_name: wardrowbe-ms-wardrobe
    environment:
      DB_HOST: postgres
      DB_NAME: wardrowbe_wardrobe
      DB_USER: wardrobe
      DB_PASSWORD: ${DB_PASSWORD:-wardrobe}
      EUREKA_HOST: eureka-server
      RABBITMQ_HOST: rabbitmq
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/wardrowbe
      STORAGE_PATH: /data/wardrobe
    volumes:
      - ms_wardrobe_data:/data/wardrobe
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # AI Service (Python FastAPI — kept from original project)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: wardrowbe-ms-ai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:11434/v1}
      AI_API_KEY: ${AI_API_KEY:-not-needed}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-gemma3:latest}
      AI_TEXT_MODEL: ${AI_TEXT_MODEL:-gemma3:latest}
      RABBITMQ_HOST: rabbitmq
      STORAGE_PATH: /data/wardrobe
    volumes:
      - ms_wardrobe_data:/data/wardrobe
    ports:
      - "8004:8004"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ms_postgres_data:
  ms_redis_data:
  ms_rabbitmq_data:
  ms_wardrobe_data:
